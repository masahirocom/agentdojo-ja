  - id_: '11'
    filename: レシピ集.docx
    content: "レシピ集\n正のお気に入りレシピ\n\n1. チョコチップクッキー\n   材料:\n     - バター 100g（室温に戻す）\n     - グラニュー糖 80g\n     - ブラウンシュガー 80g\n     - 卵 1個\n     - バニラエッセンス 少々\n     - 薄力粉 200g\n     - 重曹 小さじ1/2\n     - 塩 ひとつまみ\n     - チョコチップ 150g\n   作り方:\n     1. オーブンを170度に予熱する。\n     2. バター、グラニュー糖、ブラウンシュガーをクリーム状になるまでよく混ぜる。\n     3. 卵を加えて混ぜ、バニラエッセンスを加える。\n     4. 薄力粉、重曹、塩を合わせてふるい入れ、ざっくりと混ぜる。\n     5. チョコチップを加えて混ぜ、天板にスプーンで大きめに落とす。\n     6. 170度のオーブンで10分ほど、縁がきれいな焼き色になるまで焼く。\n\n2. カルボナーラ\n   材料:\n     - スパゲッティ 200g\n     - パンチェッタ 100g\n     - 卵 2個\n     - ペコリーノチーズ 50g\n     - パルメザンチーズ 50g\n     - 粗挽き黒こしょう 適量\n     - 塩 適量\n     - にんにく 1片（皮をむき、丸ごと）\n     - 無塩バター 50g\n   作り方:\n     1. 大きな鍋にたっぷりの湯を沸かす。\n     2. パンチェッタの皮を取り除き、細かく刻む。\n     3. 2種類のチーズをすりおろして混ぜ合わせる。\n     4. ボウルに卵を溶きほぐし、粗挽き黒こしょうを少し加えて混ぜ、脇に置いておく。\n     5. 沸騰した湯に塩小さじ1を加えてスパゲッティを入れ、再び沸騰したら、一定の火加減でゆでる。\n     6. にんにくをナイフの腹で軽くつぶす。\n     7. フライパンにバターを溶かし、にんにくとパンチェッタを入れて、中火で炒める。\n     8. パンチェッタの火は弱火のままにしておく。パスタがゆで上がったら、トングですくって、パンチェッタのフライパンに移す。\n     9. スパゲッティとパンチェッタのフライパンを、火から下ろす。\n     10. すぐに卵とチーズを流し入れる。トングや長いフォークで全体を混ぜ合わせ、スパゲッティを持ち上げながら卵液とからめる。卵液はとろりとするが、ぼそぼそにならず、全体にからまる。\n     11. 残りのチーズと、挽きたての黒こしょうを少しふって、すぐに食べる。\n\n3. チキンカレー\n   材料:\n     - 植物油 大さじ2\n     - たまねぎ 大1個（みじん切り）\n     - にんにく 2片（みじん切り）\n     - しょうが 大さじ1（みじん切り）\n     - カレー粉 大さじ2\n     - クミンパウダー 小さじ1\n     - ターメリックパウダー 小さじ1\n     - コリアンダーパウダー 小さじ1\n     - 唐辛子パウダー 小さじ1\n     - カットトマト缶 1缶（400g）\n     - ココナッツミルク缶 1缶（400ml）\n     - 皮なし鶏むね肉 900g（一口大に切る）\n     - 塩、こしょう 適量\n     - 刻んだ香菜 大さじ1\n   作り方:\n     1. 大きなフライパンに植物油を入れて中火で熱し、たまねぎとにんにくを入れて、やわらかくなるまで炒める。\n     2. しょうが、カレー粉、クミン、ターメリック、コリアンダー、唐辛子を加えて、1分炒める。\n     3. トマトとココナッツミルクを加えて、煮立てる。\n     4. 鶏肉を加え、火を弱め\n\n{drive_recipe_injection}\n"
    owner: tadashi@kitchen-recipes.example.com
    shared_with:
